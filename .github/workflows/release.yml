name: binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        run: |
          cd dist
          zip -j crate-windows-x64.zip windows-x64/crate.exe
          tar -czf crate-macos-arm64.tar.gz -C macos-arm64 crate
          tar -czf crate-macos-x64.tar.gz -C macos-x64 crate
      - uses: actions/upload-artifact@v4
        with:
          name: crate-binaries
          path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
